<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="loginstorm">
  <title>loginstorm</title>
  <g transform="translate(0 0) scale(1)">
    <defs>
      <linearGradient id="m-night" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#1E1B4B"/>
      </linearGradient>
      <linearGradient id="m-bolt" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#FFB020"/>
