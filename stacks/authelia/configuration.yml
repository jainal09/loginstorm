# Authelia for the bench: file users, SQLite storage, in-memory sessions, OIDC provider.
# Secrets come from secrets/ (scripts/gen-secrets.sh) through the template filter.
server:
  address: 'tcp://:9091/'
  # An app backend sends every user's code exchanges and refreshes from one IP, and Authelia's
  # default limit on its token endpoint is 30 requests a minute per IP, so that one (and revocation,
  # for logouts) is raised. Introspection and userinfo keep their defaults.
  endpoints:
    rate_limits:
      openid_connect_token:
        enable: true
        buckets:
          - period: '1m'
            requests: 6000
      openid_connect_revocation:
        enable: true
        buckets:
          - period: '1m'
            requests: 6000
  tls:
    key: /certs/key.pem
    certificate: /certs/cert.pem
theme: light
identity_validation:
  reset_password:
    jwt_secret: {{ secret "/secrets/jwt" | msquote }}
authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/users.yml
    watch: false
access_control:
  default_policy: one_factor
session:
  secret: {{ secret "/secrets/session" | msquote }}
  cookies:
    - domain: 'bench.test'
      authelia_url: 'https://auth.bench.test:9091'
storage:
  encryption_key: {{ secret "/secrets/storage" | msquote }}
  local:
    path: /data/db.sqlite3
notifier:
  filesystem:
    filename: /data/notification.txt
identity_providers:
  oidc:
    hmac_secret: {{ secret "/secrets/hmac" | msquote }}
    jwks:
      - key_id: 'bench'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/secrets/oidc-key.pem" | mindent 10 "|" | msquote }}
    clients:
      - client_id: 'bench-client'
        client_name: 'Bench'
        # Hashed as Authelia's docs recommend (pbkdf2-sha512, 310000 rounds; the secret is bench-secret).
        # Every client authentication costs one hash; configuration-plaintext-secret.yml skips that.
        client_secret: '$pbkdf2-sha512$310000$itCQBFkiQdHNnDiupV2g4Q$sjiWJFS57NIrT0qvSnLodCJSuT.z8JTIwReI3XNH58zexE8t4qRqBEay282pDb08.PtUd97T.eLZMKCegVWW/g'
        public: false
        authorization_policy: 'one_factor'
        # Users approve once; offline_access (refresh tokens) always needs consent.
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1y'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris: ['http://bench.invalid/callback']
        scopes: ['openid', 'offline_access', 'profile', 'email', 'groups']
        grant_types: ['authorization_code', 'refresh_token']
        response_types: ['code']
        token_endpoint_auth_method: 'client_secret_post'
        introspection_endpoint_auth_method: 'client_secret_post'
        revocation_endpoint_auth_method: 'client_secret_post'
ntp:
  # This test host's clock drifts a few seconds; keep NTP synced in production instead.
  disable_failure: true
