# Ory Kratos for the bench: Postgres, TLS on the public API, password logins only, and Ory Hydra
# as the OAuth2 provider it accepts logins for. Hashing and the rest stay at Kratos defaults.
dsn: postgres://ory:ory@db:5432/kratos?sslmode=disable
serve:
  public:
    base_url: https://kratos.bench.test:4433/
    tls:
      cert: {path: /certs/cert.pem}
      key: {path: /certs/key.pem}
  admin:
    base_url: http://kratos:4434/
# Kratos and the login UI share the session and CSRF cookies.
cookies:
  domain: bench.test
session:
  cookie:
    domain: bench.test
selfservice:
  default_browser_return_url: https://login.bench.test:4455/
  allowed_return_urls: [https://login.bench.test:4455]
  methods:
    password:
      enabled: true
  flows:
    error: {ui_url: https://login.bench.test:4455/error}
    login: {ui_url: https://login.bench.test:4455/login}
    registration: {enabled: false, ui_url: https://login.bench.test:4455/registration}
    settings: {ui_url: https://login.bench.test:4455/settings}
    recovery: {enabled: false, ui_url: https://login.bench.test:4455/recovery}
    verification: {enabled: false, ui_url: https://login.bench.test:4455/verification}
oauth2_provider:
  url: http://hydra:4445
identity:
  default_schema_id: default
  schemas:
    - {id: default, url: file:///etc/kratos/identity.schema.json}
courier:
  smtp:
    connection_uri: smtp://mail.invalid:25/?disable_starttls=true  # required setting; the bench sends no mail
