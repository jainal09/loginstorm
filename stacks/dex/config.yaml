# Dex for the bench (test-only values): Postgres storage, TLS, its local password database with
# 50 static users, and the approval screen skipped (the app is first-party).
issuer: https://dex.bench.test:5556/dex
storage:
  type: postgres
  config:
    host: db
    port: 5432
    database: dex
    user: dex
    password: dex
    ssl:
      mode: disable
web:
  https: 0.0.0.0:5556
  tlsCert: /certs/cert.pem
  tlsKey: /certs/key.pem
telemetry:
  http: 0.0.0.0:5558
oauth2:
  skipApprovalScreen: true
staticClients:
  - id: bench-client
    name: Bench
    secret: bench-secret
    redirectURIs: ['http://bench.invalid/callback']
enablePasswordDB: true
# Password: bench-password (bcrypt cost 10, as `htpasswd -bnBC 10` in Dex's docs). One hash for all is fine for a load test.
staticPasswords:
  - {email: bench-user-01@bench.test, username: bench-user-01, userID: bench-user-01, hash: &hash "$2y$10$zqP7IvvPyQCoa1/MHF99h.Rx2OLh0pnxBWjRp6SvD6lj/B7EPFcnK"}
  - {email: bench-user-02@bench.test, username: bench-user-02, userID: bench-user-02, hash: *hash}
